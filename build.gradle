plugins {
    id 'com.android.library' version '9.2.1'
}

android {
    namespace 'com.facebook.soloader'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }

    sourceSets {
        main {
            java.srcDirs = ['java']
        }
    }
}

dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}
